name: E2E tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  cypress:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Start game server
        run: npm start &

      - name: Wait for game server
        run: npx wait-on http://127.0.0.1:8080

      # Chrome 158 breaks Cypress versions older than 15.21.2 between specs.
      # Remove this pin when Cypress is upgraded to a fixed version.
      - name: Install Chrome for Testing 157
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: '157'

      - name: Run Cypress E2E tests
        uses: cypress-io/github-action@v6
        with:
          browser: ${{ steps.setup-chrome.outputs.chrome-path }}
          headed: false
