<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="40" height="40" viewBox="0 0 40 40">
 <title>Clawed beast tracks pointing north</title>
 <desc>Two staggered wolf-like paw impressions with four separate toes and elongated claw punctures. Transparent terrain overlay.</desc>
 <defs>
  <g id="paw">
   <g fill="#25241a" stroke="#9b865b" stroke-opacity=".85" stroke-width=".65" stroke-linejoin="round">
    <!-- Long tapered claw impressions, separated from the toe pads. -->
    <path d="M1 5.8 Q.1 4.2 .6 2.8 Q2.1 4 2.3 5.6Z"/>
    <path d="M4.1 3.2 Q3.7 1.4 4.8 0 Q5.2 1.7 5.4 3.1Z"/>
    <path d="M8.1 3.1 Q8.4 1.1 8.2 0 Q9.9 1.4 9.5 3.3Z"/>
    <path d="M11.4 5.5 Q12.4 3.6 12.4 2.8 Q13.5 4.4 12.8 6Z"/>
    <!-- Four distinct toe pads. -->
    <path d="M.8 6.8 Q2.3 6 3.3 8 Q4 10 2.8 10.7 Q1.2 11.2 .4 9 Q-.2 7.4 .8 6.8Z"/>
    <path d="M4.3 4.2 Q6 3.8 6.3 6 Q6.5 8.3 5.1 8.7 Q3.6 8.9 3.5 6.7 Q3.2 5 4.3 4.2Z"/>
    <path d="M8.5 4.2 Q10.1 4 10.2 6 Q10.3 8.4 8.9 8.8 Q7.3 8.6 7.4 6.4 Q7.5 4.7 8.5 4.2Z"/>
    <path d="M11.8 6.8 Q13.5 6.6 13.3 8.4 Q13.1 10.5 11.6 10.9 Q10.2 10.6 10.5 9 Q10.7 7.5 11.8 6.8Z"/>
    <!-- Lobed heel pad. -->
    <path d="M6.6 9.7 Q7.8 9.6 8.7 11 Q9.3 12 10.6 12.8 Q12 14.1 10.5 15.7 Q9.3 16.8 7.2 15.8 Q6.6 15.4 5.8 16 Q3.8 16.8 2.8 15.5 Q1.8 14 3.5 12.6 Q4.5 11.9 5.1 10.8 Q5.7 9.8 6.6 9.7Z"/>
   </g>
   <path fill="#534936" d="M4.3 13.4 Q6.5 11.4 8.5 13.4 L9.8 14.9 Q8.7 15.5 7 14.8 Q5.7 15.5 3.8 14.9Z"/>
  </g>
 </defs>
 <use xlink:href="#paw" x="21" y="2"/>
 <use xlink:href="#paw" x="5" y="21"/>
</svg>
