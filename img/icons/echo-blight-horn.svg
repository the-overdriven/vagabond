<svg xmlns="http://www.w3.org/2000/svg" viewBox="55 -123 900 900" width="900" height="900" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Echo-Blight Horn</title>
  <defs>
