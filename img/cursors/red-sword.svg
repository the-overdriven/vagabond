<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" shape-rendering="crispEdges" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="epicGlowSoft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
    <filter id="epicGlowTight" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1"/>
    </filter>
  </defs>
  <g transform="rotate(-45 16 16)">
    <!-- epic bright glow (blurred, sits behind everything) -->
    <path d="M16 2h2v1h-2z M15 3h4v1h-4z M14 4h6v18h-6z M15 22h4v1h-4z M11 23h12v1H11z M10 24h14v2H10z M11 26h12v1H11z M15 27h3v1h-3z M15 28h3v2h-3z M14 30h5v1h-5z M15 31h3v1h-3z"
          fill="#ff2a6d" opacity="0.5" filter="url(#epicGlowSoft)"/>
    <path d="M16 2h2v1h-2z M15 3h4v1h-4z M14 4h6v18h-6z M15 22h4v1h-4z M11 23h12v1H11z M10 24h14v2H10z M11 26h12v1H11z M15 27h3v1h-3z M15 28h3v2h-3z M14 30h5v1h-5z M15 31h3v1h-3z"
          fill="#ff7aa8" opacity="0.7" filter="url(#epicGlowTight)"/>

    <!-- grounding shadow (crisp, offset) -->
    <path d="M16 2h2v1h-2z M15 3h4v1h-4z M14 4h6v18h-6z M15 22h4v1h-4z M11 23h12v1H11z M10 24h14v2H10z M11 26h12v1H11z M15 27h3v1h-3z M15 28h3v2h-3z M14 30h5v1h-5z M15 31h3v1h-3z"
          fill="#16040a" fill-opacity="0.75" transform="translate(1 1)"/>

    <!-- blade outer contour (now much longer) -->
    <path d="M16 2h2v1h-2z M15 3h4v1h-4z M14 4h6v18h-6z M15 22h4v1h-4z" fill="#30070f"/>
    <!-- blade crimson body -->
    <path d="M16 3h2v1h-2z M15 4h4v17h-4z M16 21h2v1h-2z" fill="#8c0f23"/>
    <!-- blade highlights -->
    <path d="M16 4h1v17h-1z M16 3h1v1h-1z M16 21h1v1h-1z" fill="#ff7a94"/>
    <path d="M17 4h1v17h-1z M15 5h1v15h-1z" fill="#cf2942"/>
    <path d="M18 4h1v17h-1z" fill="#a8162f"/>
    <!-- fuller -->
    <path d="M17 5h1v15h-1z" fill="#5f0b18"/>

    <!-- crossguard (thinner, less bulky) -->
    <path d="M11 23h12v1H11z M10 24h14v2H10z M11 26h12v1H11z" fill="#220b08"/>
    <path d="M12 24h10v2H12z M11 24h1v1h-1z M22 24h1v1h-1z" fill="#6f101f"/>
    <path d="M12 23h6v1h-6z M13 24h7v1h-7z" fill="#d93a55"/>
    <path d="M14 25h4v1h-4z" fill="#4f0c17"/>

    <!-- grip / handle: much slimmer than before -->
    <path d="M15 27h3v1h-3z" fill="#241610"/>
    <path d="M15 28h3v2h-3z" fill="#6b3724"/>
    <path d="M16 28h1v2h-1z" fill="#af6a45"/>
    <path d="M15 28h3v1h-3z" fill="#4a2518"/>

    <!-- pommel -->
    <path d="M14 30h5v1h-5z" fill="#2f0d14"/>
    <path d="M15 31h3v1h-3z" fill="#8f1127"/>
  </g>
</svg>
