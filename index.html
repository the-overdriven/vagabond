<!DOCTYPE html>
<html lang="en">
<head>

  <style>

<script>
  (function(){

    /* ============================== RNG ============================== */
// rngState is kept as a plain, reassignable variable (rather than hidden inside
// a closure) so a save file can capture the exact RNG position and a loaded
// game continues the same random sequence instead of restarting it.
    const WORLD_SEED = Date.now() & 0xffffffff;
    let rngState = WORLD_SEED;
    function rng(){
      rngState |= 0; rngState = (rngState + 0x6D2B79F5) | 0;
      let t = Math.imul(rngState ^ (rngState >>> 15), 1 | rngState);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    }
    function randInt(a,b){ return Math.floor(rng()*(b-a+1))+a; }
    function pick(arr){ return arr[Math.floor(rng()*arr.length)]; }
    function chance(p){ return rng() < p; }

      "Savage":  e=>{e.atk=Math.round(e.atk*1.3); e.spd=Math.round(e.spd*1.3)+1; e.aggro=(e.aggro||0)+1;},
      "Hardened":e=>{e.hp=Math.round(e.hp*1.4); e.maxHp=e.hp; e.def=Math.round(e.def*1.3)+1;},
      "Rabid":   e=>{e.spd=Math.round(e.spd*1.8)+2; e.def=Math.max(0,Math.round(e.def*0.6)); e.aggro=(e.aggro||0)+1;},
      "Champion":e=>{e.hp=Math.round(e.hp*1.6); e.maxHp=e.hp; e.atk=Math.round(e.atk*1.4)+1; e.def=Math.round(e.def*1.3)+1; e.spd=Math.round(e.spd*1.2)+1;},
    };
    const ENEMY_TEMPLATE_BY_NAME = Object.fromEntries(ENEMY_TEMPLATES.map(t=>[t.name,t]));
    function enemyTemplateForSavedEnemy(e){
      if(e && e.baseName && ENEMY_TEMPLATE_BY_NAME[e.baseName]) return ENEMY_TEMPLATE_BY_NAME[e.baseName];
      if(e && e.name && ENEMY_TEMPLATE_BY_NAME[e.name]) return ENEMY_TEMPLATE_BY_NAME[e.name];
      return null;
    }

    /* ============================== MAP GENERATION ============================== */
    const MAP_W = 260, MAP_H = 180;
    const TILE = {
      water:    {ch:'~', color:'#4f8fc9', bg:'#0c1a26', walk:false},
      river:    {ch:'~', color:'#7fd0d8', bg:'#0e1f22', walk:true},
      sand:     {ch:'.', color:'#c99b3a', bg:'#f3e0a3', walk:true},
      grass:    {ch:'.', color:'#6fae4a', bg:'#101a0c', walk:true},
      forest:   {ch:'\u2663', color:'#2f7a3a', bg:'#0b160b', walk:true},
      hill:     {ch:'\u2229', color:'#a8945f', bg:'#1a160c', walk:true},
      mountain: {ch:'\u25b2', color:'#8d8d8d', bg:'#141414', walk:false},
      snow:     {ch:'.', color:'#eef5fa', bg:'#12181c', walk:true},
      // cavefloor:{ch:'.', color:'#8a7aa5', bg:'#120e18', walk:true},
      // cavewall: {ch:'#', color:'#2a2233', bg:'#0a0810', walk:false},
      temple:   {ch:'\u2626', color:'#ffe08a', bg:'#221a08', walk:true},
      boulder:  {ch:'\u25cf', color:'#7a7a7a', bg:'#141414', walk:false},
    };
// Single-char codes for compact map serialization in save files.
    const TILE_CODE = {water:'w',river:'r',sand:'s',grass:'g',forest:'f',hill:'h',mountain:'m',snow:'n',temple:'t',boulder:'b'};
    const CODE_TILE = Object.fromEntries(Object.entries(TILE_CODE).map(([k,v])=>[v,k]));

    function makeNoise(cellsX, cellsY){
      const grid = [];
      for(let y=0;y<=cellsY;y++){
        const row=[];
        for(let x=0;x<=cellsX;x++) row.push(rng());
        grid.push(row);
      }
      return function(x,y,w,h){
        const fx = x/w*cellsX, fy = y/h*cellsY;
        let x0 = Math.floor(fx), y0 = Math.floor(fy);
        x0 = Math.min(x0, cellsX-1); y0 = Math.min(y0, cellsY-1);
        const x1=x0+1, y1=y0+1;
        const sx = fx-x0, sy = fy-y0;
        const lerp=(a,b,t)=>a+(b-a)*t;
        const top = lerp(grid[y0][x0], grid[y0][x1], sx);
        const bot = lerp(grid[y1][x0], grid[y1][x1], sx);
        return lerp(top,bot,sy);
      };
    }
    function fbm(fns, weights, x,y,w,h){
      let s=0, tw=0;
      for(let i=0;i<fns.length;i++){ s += fns[i](x,y,w,h)*weights[i]; tw+=weights[i]; }
      return s/tw;
    }

    let map = []; // map[y][x] = tile key string
    let spawnPoint = {x:0,y:0};
    let discovered = []; // discovered[y][x] = has the player ever seen this tile on the main screen
    let minimapDirty = true;
    let miniPlayerX = -1, miniPlayerY = -1;
    function initDiscovered(){
      discovered = [];
      for(let y=0;y<MAP_H;y++) discovered.push(new Array(MAP_W).fill(false));
    }

    function generateMap(){
      const elevFns = [makeNoise(6,4), makeNoise(14,10), makeNoise(30,22)];
      const elevW = [0.55,0.3,0.15];
      const moistFns = [makeNoise(5,5), makeNoise(16,16)];
      const moistW = [0.6,0.4];
      const roughFn = makeNoise(52, 38);
      const moistDetailFn = makeNoise(44, 32);
      const lakeFn = makeNoise(9,7);
      const boulderFn = makeNoise(40,30);

      const elev = [], moist = [];
      for(let y=0;y<MAP_H;y++){
        elev.push(new Float32Array(MAP_W));
        moist.push(new Float32Array(MAP_W));
      }
      const cx = MAP_W/2, cy = MAP_H/2;
      const maxD = Math.sqrt(cx*cx+cy*cy);
      for(let y=0;y<MAP_H;y++){
        for(let x=0;x<MAP_W;x++){
          let e = fbm(elevFns, elevW, x,y,MAP_W,MAP_H);
          e += (roughFn(x,y,MAP_W,MAP_H) - 0.5) * 0.16;
          const d = Math.sqrt((x-cx)*(x-cx)+(y-cy)*(y-cy))/maxD;
          e -= Math.pow(d,2.2)*0.55; // island falloff
          const lk = lakeFn(x,y,MAP_W,MAP_H);
          if(lk > 0.72 && e > 0.28 && e < 0.6) e -= 0.4; // carve inland lakes
          elev[y][x] = e;
          moist[y][x] = fbm(moistFns, moistW, x,y,MAP_W,MAP_H) + (moistDetailFn(x,y,MAP_W,MAP_H) - 0.5) * 0.12;
        }
      }

      for(let y=0;y<MAP_H;y++){
        const row = [];
        for(let x=0;x<MAP_W;x++){
          const e = elev[y][x], m = moist[y][x];
          let t;
          if(e < 0.24) t='water';
          else if(e < 0.29) t='sand';
          else if(e < 0.58){
            if(m > 0.55) t='forest';
            else t='grass';
          }           else if(e < 0.68) t='hill';
          else if(e < 0.86) t='mountain';
          else t = (m>0.5) ? 'snow' : 'mountain';
          row.push(t);
        }
        map.push(row);
      }

      // Scattered boulders: sprinkle extra impassable terrain across walkable lowlands
      for(let y=0;y<MAP_H;y++){
        for(let x=0;x<MAP_W;x++){
          const t = map[y][x];
          if(t==='grass' || t==='forest' || t==='hill' || t==='sand'){
            const b = boulderFn(x,y,MAP_W,MAP_H);
            if(b > 0.80) map[y][x] = 'boulder';
          }
        }
      }

      // Rivers: from random high points, descend toward water
      const riverSources = [];
      for(let i=0;i<9;i++){
        riverSources.push({x:randInt(4,MAP_W-5), y:randInt(4,MAP_H-5)});
      }
      for(const src of riverSources){
        let x=src.x, y=src.y;
        if(elev[y][x] < 0.6) continue;
        for(let step=0; step<400; step++){
          if(map[y][x]==='water') break;
          if(map[y][x]!=='mountain' && map[y][x]!=='cavewall') map[y][x]='river';
          // find lowest neighbor
          let bestX=x, bestY=y, bestE=elev[y][x];
          for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
            if(dx===0&&dy===0) continue;
            const nx=x+dx, ny=y+dy;
            if(nx<0||ny<0||nx>=MAP_W||ny>=MAP_H) continue;
            if(elev[ny][nx] < bestE){ bestE=elev[ny][nx]; bestX=nx; bestY=ny; }
          }
          if(bestX===x && bestY===y) break;
          x=bestX; y=bestY;
        }
      }

      // NOTE: cave generation ('cavefloor'/'cavewall') used to live here, but those
      // tile keys have no entry in TILE{} (they're commented out above) - any cave
      // tile that scrolled into view would crash render(). Removed until caves are
      // actually supported again.

      // Spawn point: near center, on grass/hill
      let sx = Math.floor(MAP_W/2), sy = Math.floor(MAP_H/2);
      let found=false;
      for(let r=0;r<40 && !found;r++){
        for(let dy=-r;dy<=r && !found;dy++){
          for(let dx=-r;dx<=r && !found;dx++){
            const nx=sx+dx, ny=sy+dy;
            if(nx<2||ny<2||nx>=MAP_W-2||ny>=MAP_H-2) continue;
            if(map[ny][nx]==='grass' || map[ny][nx]==='hill'){
              sx=nx; sy=ny; found=true;
            }
          }
        }
      }
      spawnPoint = {x:sx,y:sy};
      map[sy][sx] = 'temple';
    }

    function isWalkable(x,y){
      if(x<0||y<0||x>=MAP_W||y>=MAP_H) return false;
      const key = map[y][x];
      const tile = TILE[key];
      if(!tile){
        console.warn('Unknown tile at', x, y, '-> value was:', key);
        return false;
      }
      return tile.walk;
    }

    /* ============================== ITEM / ENTITY FACTORIES ============================== */
    function rollModifier(baseName, item){
      if(!chance(0.20)) return item;
      const mod = pick(MODIFIERS);
      item.mod = mod.stat;
      item.name = mod.name + " " + baseName;
      const amt = randInt(1,3);
      item.modAmt = amt;
      if(mod.stat==='xp') item.xpBonus = randInt(5,15); // % bonus
      return item;
    }
    function makeWeaponItem(tier){
      const pool = WEAPONS.filter(w=>w.tier<=tier);
      const base = pick(pool.length?pool:WEAPONS.filter(w=>w.tier===1));
      const item = {kind:'weapon', base:base.name, atk:base.atk, spd:base.spd, tier:base.tier, name:base.name};
      return rollModifier(base.name, item);
    }
    function makeShieldItem(tier){
      const pool = SHIELDS.filter(s=>s.tier<=tier);
      const base = pick(pool.length?pool:SHIELDS.filter(s=>s.tier===1));
      const item = {kind:'shield', base:base.name, def:base.def, tier:base.tier, name:base.name};
      return rollModifier(base.name, item);
    }
    function makeArmorItem(tier){
      const pool = ARMORS.filter(a=>a.tier<=tier);
      const base = pick(pool.length?pool:ARMORS.filter(a=>a.tier===1));
      const item = {kind:'armor', base:base.name, def:base.def, tier:base.tier, name:base.name};
      return rollModifier(base.name, item);
    }
    function itemStatLine(it){
      const parts=[];

      if(it.atk) parts.push('ATK '+it.atk+(it.mod==='atk'?('+'+it.modAmt):''));
      if(it.def) parts.push('DEF '+it.def+(it.mod==='def'?('+'+it.modAmt):''));
      if(it.spd!==undefined) parts.push('SPD '+it.spd+(it.mod==='spd'?('+'+it.modAmt):''));

      if(it.mod==='atk' && !it.atk) parts.push('ATK +'+it.modAmt);
      if(it.mod==='def' && !it.def) parts.push('DEF +'+it.modAmt);
      if(it.mod==='spd' && it.spd===undefined) parts.push('SPD +'+it.modAmt);

      if(it.mod==='hp') parts.push('HP +'+it.modAmt);
      if(it.mod==='mf') parts.push('MF +'+it.modAmt);
      if(it.mod==='xp') parts.push('XP +'+it.xpBonus+'%');

      return parts.join(' ');
    }

    /* ============================== PLAYER ============================== */
    const player = {
      x: 0, y: 0,
      lvl: 1, xp: 0,
      maxHp: 50, hp: 50,
      baseAtk: 2, baseDef: 0, baseSpd: 3, baseMf: 0,
      gold: 0, deaths: 0, steps: 0,
      invisibleTurns: 0,
      speedPotionTurns: 0,
      equip: {weapon:null, shield:null, armor:null},
      inventory: [],
    };
    function xpToNext(lvl){ return Math.floor(14 * Math.pow(lvl, 1.55)) + 10; }
    function recalcDerived(){
      // bonuses from modifiers on equipped gear + inventory 'vital'/'lucky' aren't passive; only equipped gear counts
      let bonusHp=0;
      for(const slot of ['weapon','shield','armor']){
        const it = player.equip[slot];
        if(it && it.mod==='hp') bonusHp += it.modAmt;
      }
      player._bonusHp = bonusHp;
    }
    function playerAtk(){
      let a = player.baseAtk;
      for(const slot of ['weapon','shield','armor']){
        const it = player.equip[slot];
        if(!it) continue;
        if(it.atk) a += it.atk;
        if(it.mod==='atk') a += it.modAmt;
      }
      return a;
    }

    function playerDef(){
      let d = player.baseDef;
      for(const slot of ['weapon','shield','armor']){
        const it = player.equip[slot];
        if(!it) continue;
        if(it.def) d += it.def;
        if(it.mod==='def') d += it.modAmt;
      }
      return d;
    }
    function playerSpd(){
      let s = player.baseSpd;
      const w = player.equip.weapon;
      if(w){ s += Math.floor(w.spd/2); if(w.mod==='spd') s += w.modAmt; }
      if(player.equip.shield) s -= 1;
      if(player.equip.armor) s -= 1;
      for(const slot of ['shield','armor']) if(player.equip[slot] && player.equip[slot].mod==='spd') s+=player.equip[slot].modAmt;
      if(player.speedPotionTurns > 0) s += 3;
      return s;
    }
    function playerMf(){
      let mf = player.baseMf;
      for(const slot of ['weapon','shield','armor']) if(player.equip[slot] && player.equip[slot].mod==='mf') mf+=player.equip[slot].modAmt;
      return mf;
    }
    function playerMaxHp(){
      let bonus=0;
      for(const slot of ['weapon','shield','armor']) if(player.equip[slot] && player.equip[slot].mod==='hp') bonus+=player.equip[slot].modAmt;
      return player.maxHp + bonus;
    }
    function xpMultiplier(){
      let m=1;
      for(const slot of ['weapon','shield','armor']){
        const it = player.equip[slot];
        if(it && it.mod==='xp') m += it.xpBonus/100;
      }
      return m;
    }
    function gainXp(amount){
      amount = Math.round(amount * xpMultiplier());
      player.xp += amount;
      log(`You gain ${amount} XP.`, 'good');
      let leveled=false;
      while(player.xp >= xpToNext(player.lvl)){
        player.xp -= xpToNext(player.lvl);
        player.lvl++;
        const hpGain = randInt(4,7);
        player.maxHp += hpGain;
        leveled=true;
        log(`You reached Level ${player.lvl}! (+${hpGain} max HP)`, 'good');
      }
      if(leveled) updateHud();
    }

    /* ============================== EXPLORATION ============================== */
// One-time reward for reaching each of the four edges of the map - a rare
// milestone, not something that fires from ordinary wandering.
    const EDGE_MARGIN = 2; // how close to the true map boundary counts as "the edge"
    const EDGE_XP = 100;
    const worldEdgesReached = {north:false, south:false, east:false, west:false};
    function checkWorldEdge(){
      let dir = null;
      if(!worldEdgesReached.north && player.y <= EDGE_MARGIN) dir = 'north';
      else if(!worldEdgesReached.south && player.y >= MAP_H-1-EDGE_MARGIN) dir = 'south';
      else if(!worldEdgesReached.west && player.x <= EDGE_MARGIN) dir = 'west';
      else if(!worldEdgesReached.east && player.x >= MAP_W-1-EDGE_MARGIN) dir = 'east';
      if(!dir) return;
      worldEdgesReached[dir] = true;
      log(`You have wandered farther ${dir} than any soul before you - the world ends here.`, 'good');
      gainXp(EDGE_XP);
    }

    /* ============================== ENEMIES / ITEMS ON MAP ============================== */
    let enemies = [];
    let groundItems = []; // {x,y,kind:'gold'|'potion'|'speedpotion'|'scroll'|'item', amount, item}
    let occupied = new Set(); // "x,y" for enemies

    function keyXY(x,y){ return x+','+y; }

    function spawnEnemies(){
      const total = 120;
      const weights = [0.42,0.26,0.17,0.10,0.05]; // tier 1..5
      for(let i=0;i<total;i++){
        let r = rng(), tier=1, acc=0;
        for(let t=0;t<5;t++){ acc+=weights[t]; if(r<=acc){ tier=t+1; break; } }
        const templates = ENEMY_TEMPLATES.filter(e=>e.tier===tier);
        const tmpl = pick(templates);
        let x,y,tries=0;
        do{
          x = randInt(2,MAP_W-3); y = randInt(2,MAP_H-3); tries++;
        } while((!isWalkable(x,y) || map[y][x]==='temple' ||
          (Math.abs(x-spawnPoint.x)+Math.abs(y-spawnPoint.y) < 20) ||
          occupied.has(keyXY(x,y))) && tries<200);
        if(tries>=200) continue;
        const variance = 0.95 + rng()*0.10;
        const e = {
          name: tmpl.name, tier: tmpl.tier,
          hp: Math.max(1,Math.round(tmpl.hp*variance)),
          atk: Math.max(1,Math.round(tmpl.atk*variance)),
          def: Math.max(0,Math.round(tmpl.def*variance)),
          spd: Math.max(1,Math.round(tmpl.spd*variance)),
            fly: !!tmpl.fly,
            aggro: tmpl.aggro ?? AGGRO_RANGE,
            x, y, homeX:x, homeY:y, alive:true, prefix:null,
          };
        e.maxHp = e.hp;
        e.baseName = tmpl.name; // keep clean name for image lookup, separate from display name
        if(chance(0.05)){
          const names = Object.keys(ENEMY_PREFIXES);
          const pfx = pick(names);
          e.prefix = pfx;
          ENEMY_PREFIXES[pfx](e);
          e.name = pfx + " " + e.name;
        }
        enemies.push(e);
        occupied.add(keyXY(x,y));
      }
    }
    function spawnGroundStuff(){
      // chests
      for(let i=0;i<45;i++){
        let x,y,tries=0;
        do{ x=randInt(2,MAP_W-3); y=randInt(2,MAP_H-3); tries++; }
        while((!isWalkable(x,y) || map[y][x]==='temple') && tries<200);
        if(tries>=200) continue;
        const distTier = Math.min(5, 1+Math.floor((Math.abs(x-spawnPoint.x)+Math.abs(y-spawnPoint.y))/45));
        groundItems.push({x,y,kind:'chest', tier:distTier, opened:false});
      }
      // loose potions
      for(let i=0;i<30;i++){
        let x,y,tries=0;
        do{ x=randInt(2,MAP_W-3); y=randInt(2,MAP_H-3); tries++; }
        while((!isWalkable(x,y) || map[y][x]==='temple') && tries<200);
        if(tries>=200) continue;
        groundItems.push({x,y,kind:'potion'});
      }
      // scrolls of invisibility
      for(let i=0;i<9;i++){
        let x,y,tries=0;
        do{ x=randInt(2,MAP_W-3); y=randInt(2,MAP_H-3); tries++; }
        while((!isWalkable(x,y) || map[y][x]==='temple') && tries<200);
        if(tries>=200) continue;
        groundItems.push({x,y,kind:'scroll'});
      }
      // speed potions
      for(let i=0;i<3;i++){
        let x,y,tries=0;
        do{ x=randInt(2,MAP_W-3); y=randInt(2,MAP_H-3); tries++; }
        while((!isWalkable(x,y) || map[y][x]==='temple') && tries<200);
        if(tries>=200) continue;
        groundItems.push({x,y,kind:'speedpotion'});
      }
    }

    /* ============================== LOG ============================== */
    const logEl = document.getElementById('logpanel');
    const logQueue = [];
    let isTyping = false;
    let nextLogId = 1;
    let lastRenderedLogId = 0;
    let logWaiters = [];

    function notifyLogWaiters(){
      if(!logWaiters.length) return;
      const remaining = [];
      for(const waiter of logWaiters){
        if(waiter.id <= lastRenderedLogId) waiter.resolve();
        else remaining.push(waiter);
      }
      logWaiters = remaining;
    }

    function waitForLogId(id){
      if(lastRenderedLogId >= id) return Promise.resolve();
      return new Promise(resolve => logWaiters.push({ id: id, resolve: resolve }));
    }

    // Resolves once every queued message has finished revealing (nothing left to
    // type and nothing pending in the queue), not merely a specific message id.
    function waitForLogIdle(){
      return new Promise(resolve => {
        const check = () => {
          if(!isTyping && logQueue.length === 0) resolve();
          else setTimeout(check, 30);
        };
        check();
      });
    }

    function log(msg, cls) {
      const id = nextLogId++;
      logQueue.push({ id: id, msg: msg, cls: cls || 'info' });
      processLogQueue();
      return id;
    }

    async function processLogQueue() {
      if (isTyping || logQueue.length === 0) return;

      isTyping = true;

      const { id, msg, cls } = logQueue.shift();

      const div = document.createElement('div');
      div.className = cls;
      logEl.appendChild(div);

      const trimLog = () => {
        while (logEl.children.length > 60) {
          logEl.removeChild(logEl.firstChild);
        }
      };

      if (logQueue.length > 2) {
        div.textContent = msg;
        trimLog();
        logEl.scrollTop = logEl.scrollHeight;
      } else {
        for (const char of msg) {
          div.textContent += char;
          trimLog();
          logEl.scrollTop = logEl.scrollHeight;
          await new Promise(resolve => setTimeout(resolve, 10));
        }
      }

      isTyping = false;
      lastRenderedLogId = id;
      notifyLogWaiters();
      processLogQueue();
    }

    /* ============================== COMBAT / LOOT ============================== */
    function tierColorClass(tier){ return 'tier'+tier; }

    function maybeAutoEquipWeapon(item, announce = true){
      if(!item || item.kind !== 'weapon' || player.equip.weapon) return false;
      player.equip.weapon = item;
      if(announce) log(`You automatically equip the ${item.name}.`, 'good');
      return true;
    }
    function lootFromEnemy(e){
      const mf = playerMf();
      player.gold += Math.max(1, Math.round(randInt(1,5)*e.tier*(1+mf*0.05)));
      const dropChance = 0.45 + mf*0.02 + e.tier*0.03;
      if(chance(Math.min(0.9,dropChance))){
        const roll = rng();
        let tier = e.tier;
        if(chance(0.35) && tier>1) tier -= 1;
        let item;
        if(roll<0.5) item = makeWeaponItem(tier);
        else if(roll<0.75) item = makeArmorItem(tier);
        else item = makeShieldItem(tier);
        log(`The ${e.name} dropped a ${item.name}.`, 'loot');
        // Only skip the backpack when the weapon actually went straight to the
        // empty weapon slot - otherwise the drop would silently vanish.
        if(item.kind === 'weapon' && maybeAutoEquipWeapon(item, true)) return;
        player.inventory.push(item);
      }
    }

    function xpForEnemy(e){
      let base = e.tier*10 + Math.floor((e.maxHp + e.atk*2 + e.def*2)/3);
      if(e.prefix) base = Math.round(base*1.5);
      return base;
    }

    function damageRoll(atk, def){
      return Math.max(1, Math.round(atk - def*0.5 + (rng()*3 - 1)));
    }
    function missChance(attackerSpd, defenderSpd){
      const chanceValue = 0.15 + (defenderSpd - attackerSpd) * 0.02;
      return Math.max(0, Math.min(1, chanceValue));
    }

    async function playerAttackEnemy(e){
      const weaponName = player.equip.weapon ? player.equip.weapon.name : 'bare fists';
      await animateAttackLunge(player.x, player.y, e.x, e.y);
      if(chance(missChance(playerSpd(), e.spd))){
        log(`You swing your ${weaponName} at the ${e.name} but miss.`, 'bad');
        return;
      }
      const dmg = damageRoll(playerAtk(), e.def);
      e.hp -= dmg;
      log(`You strike the ${e.name} with your ${weaponName} for ${dmg}.`, 'good');
      if(e.hp <= 0){
        killEnemy(e);
      }
    }
    function enemyAttackPlayer(e){
      if(chance(missChance(e.spd, playerSpd()))){
        log(`The ${e.name} attacks but misses you.`, 'good');
        return false;
      }
      let dmg = damageRoll(e.atk, playerDef());
      if(e.crit && chance(0.15)) dmg = Math.round(dmg*2);
      player.hp -= dmg;
      log(`The ${e.name} hits you for ${dmg}.`, 'bad');
      updateHud();
      if(player.hp <= 0){
        die();
        return true;
      }
      return false;
    }
    function killEnemy(e){
      log(`You have slain the ${e.name}!`, 'good');
      e.alive = false;
      occupied.delete(keyXY(e.x,e.y));
      enemies = enemies.filter(x=>x!==e);
      gainXp(xpForEnemy(e));
      lootFromEnemy(e);
      updateHud();
    }
    function startDeathFade(){
      if(!deathTransition || deathTransition.phase !== 'pending') return;
      deathTransition = { phase:'out', start: performance.now(), duration: 900 };
      const step = (now)=>{
        render(now);
        if(!deathTransition) return;
        const elapsed = now - deathTransition.start;
        if(deathTransition.phase === 'out' && elapsed >= deathTransition.duration){
          player.x = spawnPoint.x; player.y = spawnPoint.y;
          player.hp = playerMaxHp();
          snapCameraToPlayer();
          updateHud();
          deathTransition = { phase:'in', start: now, duration: 900 };
          render(now);
          requestAnimationFrame(step);
          return;
        }
        if(deathTransition.phase === 'in' && elapsed >= deathTransition.duration){
          stopDeathTransition();
          render(now);
          return;
        }
        requestAnimationFrame(step);
      };
      render(performance.now());
      requestAnimationFrame(step);
    }

    function die(){
      if(deathTransition) return;
      player.deaths++;
      pendingMove = null;
      const deathLogId = log(`You have fallen... and awaken at the Temple.`, 'bad');
      stopCameraAnimation();
      stopAttackAnimation();
      deathTransition = { phase:'pending', start: performance.now(), duration: 900 };
      waitForLogId(deathLogId).then(waitForLogIdle).then(startDeathFade);
    }

    /* ============================== ENEMY AI TURN ============================== */
    const ATTACK_RANGE = 1; // Chebyshev distance at which an enemy attacks instead of chasing
    const AGGRO_RANGE = 3;  // default aggro distance used when a template doesn't specify one
    function enemyAggroRange(e){
      return e && typeof e.aggro === 'number' ? e.aggro : AGGRO_RANGE;
    }
    function enemyCanTraverse(e, x, y){
      if(x<0 || y<0 || x>=MAP_W || y>=MAP_H) return false;
      if(isWalkable(x,y)) return true;
      if(!(e && e.fly)) return false;
      const tile = map[y][x];
      return tile === 'boulder' || tile === 'water';
    }
    function enemyStepTowardPlayer(e){
      const dx = player.x - e.x, dy = player.y - e.y;
      const sx = Math.sign(dx), sy = Math.sign(dy);
      let nx = e.x + sx, ny = e.y + sy;
      if(!(enemyCanTraverse(e,nx,ny) && !occupied.has(keyXY(nx,ny)) && !(nx===player.x&&ny===player.y))){
        // try only x
        nx = e.x + sx; ny = e.y;
        if(!(sx!==0 && enemyCanTraverse(e,nx,ny) && !occupied.has(keyXY(nx,ny)))){
          nx = e.x; ny = e.y + sy;
          if(!(sy!==0 && enemyCanTraverse(e,nx,ny) && !occupied.has(keyXY(nx,ny)))){
            return false; // stuck
          }
        }
      }
      occupied.delete(keyXY(e.x,e.y));
      e.x = nx; e.y = ny;
      occupied.add(keyXY(e.x,e.y));
      return true;
    }
    /* --- Idle wander tuning: flip these to change the behaviour at any time --- */
    const ENEMY_WANDER_ENABLED = true;  // false = enemies stand perfectly still when idle
    const ENEMY_WANDER_LEASH   = true;  // false = they roam freely instead of sticking near home
    const ENEMY_WANDER_CHANCE  = 0.3;   // chance per turn that an idle on-screen enemy shuffles
    const ENEMY_WANDER_RADIUS  = 1;     // how far (in squares) they may stray from their home tile
    /* ------------------------------------------------------------------------ */

    // Idle enemies the player can actually see shuffle around a little so the world
    // doesn't look frozen. Only on-screen enemies wander, so off-screen creatures
    // don't drift away from where they were placed.
    function enemyIsOnScreen(e){
      const vx = e.x - targetCamX(), vy = e.y - targetCamY();
      return vx>=0 && vy>=0 && vx<VIEW_W && vy<VIEW_H;
    }
    function enemyWander(e){
      if(!ENEMY_WANDER_ENABLED) return;
      if(!chance(ENEMY_WANDER_CHANCE)) return;
      // Anchor the home tile on first wander, and re-anchor whenever a chase has
      // already carried the enemy beyond its leash - otherwise it could never move
      // again after giving up a pursuit.
      if(e.homeX === undefined || e.homeY === undefined ||
         Math.max(Math.abs(e.x-e.homeX), Math.abs(e.y-e.homeY)) > ENEMY_WANDER_RADIUS){
        e.homeX = e.x; e.homeY = e.y;
      }
      const options = [];
      for(let dy=-1; dy<=1; dy++){
        for(let dx=-1; dx<=1; dx++){
          if(dx===0 && dy===0) continue;
          const nx = e.x+dx, ny = e.y+dy;
          if(ENEMY_WANDER_LEASH &&
             Math.max(Math.abs(nx-e.homeX), Math.abs(ny-e.homeY)) > ENEMY_WANDER_RADIUS) continue;
          if(nx===player.x && ny===player.y) continue;
          if(!enemyCanTraverse(e,nx,ny)) continue;
          if(occupied.has(keyXY(nx,ny))) continue;
          options.push({x:nx, y:ny});
        }
      }
      if(!options.length) return;
      const pick = options[randInt(0, options.length-1)];
      occupied.delete(keyXY(e.x,e.y));
      e.x = pick.x; e.y = pick.y;
      occupied.add(keyXY(e.x,e.y));
    }
    function enemyTurn(){
      if(player.hp <= 0 || deathTransition) return;
      if(player.speedPotionTurns > 0){
        player.speedPotionTurns--;
        if(player.speedPotionTurns === 0) log('The speed boost wears off.', 'info');
      }
      if(player.invisibleTurns > 0){
        player.invisibleTurns--;
        if(player.invisibleTurns === 0) log('The invisibility fades.', 'info');
        return; // while invisible, enemies neither chase nor attack
      }
      for(const e of enemies.slice()){
        if(!e.alive) continue;
        const dx = player.x - e.x, dy = player.y - e.y;
        const dist = Math.max(Math.abs(dx), Math.abs(dy));
        if(dist === ATTACK_RANGE){
          if(enemyAttackPlayer(e)) return;
          continue;
        }
        const aggroRange = enemyAggroRange(e);
        if(dist <= aggroRange){
          const playerSpeed = playerSpd();
          const slowEnough = e.spd * 2 <= playerSpeed;
          if(e.aware && slowEnough && chance(0.25)){
            e.aware = false;
            log(`The ${e.name} loses interest in the chase.`, 'info');
            continue;
          }
          if(!e.aware){
            e.aware = true;
            log(`The ${e.name} has spotted you!`, 'bad');
          }
          const hasExtraPursuitTurn = e.spd > playerSpeed && chance(0.25);
          if(hasExtraPursuitTurn) log(`The ${e.name} is faster and gaining on you!`, 'bad');
          let pursuitActions = hasExtraPursuitTurn ? 2 : 1;
          while(pursuitActions > 0){
            const distNow = Math.max(Math.abs(player.x - e.x), Math.abs(player.y - e.y));
            if(distNow <= ATTACK_RANGE){
              if(enemyAttackPlayer(e)) return;
              break;
            }
            if(!enemyStepTowardPlayer(e)) break;
            if(player.hp <= 0 || deathTransition) return;
            pursuitActions--;
          }
        } else {
          e.aware = false;
          if(enemyIsOnScreen(e)) enemyWander(e);
        }
      }
    }

    /* ============================== ITEM PICKUP ============================== */
    function addPotion(){
      const stack = player.inventory.find(i=>i.kind==='potion');
      if(stack) stack.count = (stack.count||1)+1;
      else player.inventory.push({kind:'potion', name:'Life Potion', count:1});
    }
    function addScroll(){
      const stack = player.inventory.find(i=>i.kind==='scroll');
      if(stack) stack.count = (stack.count||1)+1;
      else player.inventory.push({kind:'scroll', name:'Scroll of Invisibility', count:1});
    }
    function addSpeedPotion(){
      const stack = player.inventory.find(i=>i.kind==='speedpotion');
      if(stack) stack.count = (stack.count||1)+1;
      else player.inventory.push({kind:'speedpotion', name:'Potion of Speed', count:1});
    }
    function checkGroundAt(x,y){
      for(let i=groundItems.length-1;i>=0;i--){
        const g = groundItems[i];
        if(g.x!==x || g.y!==y) continue;
        if(g.kind==='chest'){
          if(g.opened) continue;
          g.opened = true;
          const mf = playerMf();
          const roll = rng();
          if(roll<0.45){
            const gold = randInt(5,15)*g.tier + Math.round(mf*2);
            player.gold += gold;
            log(`You open a chest and find ${gold} gold!`, 'loot');
          } else if(roll<0.65){
            const lowTier = Math.min(2, Math.max(1, g.tier));
            const pickRoll = rng();
            let item;
            if(pickRoll < 0.33) item = makeWeaponItem(lowTier);
            else if(pickRoll < 0.66) item = makeArmorItem(lowTier);
            else item = makeShieldItem(lowTier);
            log(`You open a chest and find ${item.name}.`, 'loot');
            if(!(item.kind === 'weapon' && maybeAutoEquipWeapon(item, true))){
              player.inventory.push(item);
            }
          } else if(roll<0.85){
            addPotion();
            log(`You open a chest and find a Life Potion!`, 'loot');
          } else if(roll<0.91){
            addScroll();
            log(`You open a chest and find a Scroll of Invisibility!`, 'loot');
          } else {
            addSpeedPotion();
            log(`You open a chest and find a Potion of Speed!`, 'loot');
          }
          groundItems.splice(i,1);
        } else if(g.kind==='potion'){
          addPotion();
          log(`You pick up a Life Potion.`, 'loot');
          groundItems.splice(i,1);
        } else if(g.kind==='speedpotion'){
          addSpeedPotion();
          log(`You pick up a Potion of Speed.`, 'loot');
          groundItems.splice(i,1);
        } else if(g.kind==='scroll'){
          addScroll();
          log(`You pick up a Scroll of Invisibility.`, 'loot');
          groundItems.splice(i,1);
        }
      }
    }




    /* ============================== MOVEMENT ============================== */
    let mapOpen=false, invOpen=false;
    // Buffering one move while the step animation plays keeps held-key walking
    // continuous - without it every input during the 140ms pan is dropped, which
    // reads as stuttering.
    let pendingMove = null;
    function flushPendingMove(){
      if(!pendingMove) return;
      const next = pendingMove;
      pendingMove = null;
      tryMove(next.dx, next.dy);
    }
    async function tryMove(dx,dy){
      if(mapOpen || invOpen || deathTransition) return;
      if(cameraAnimating || attackAnim){
        pendingMove = {dx:dx, dy:dy};
        return;
      }
      const nx = player.x+dx, ny = player.y+dy;
      const ek = keyXY(nx,ny);
      const target = enemies.find(e=>e.x===nx && e.y===ny && e.alive);
      if(target){
        await playerAttackEnemy(target);
        enemyTurn();
        render(); updateHud(); updateTooltip();
        flushPendingMove();
        return;
      }
      let moved = false;
      const fromPos = {x:player.x, y:player.y};
      if(isWalkable(nx,ny)){
        player.x = nx; player.y = ny;
        player.steps++;
        checkGroundAt(nx,ny);
        checkWorldEdge();
        if(map[ny][nx]==='temple'){
          if(player.hp < playerMaxHp()){
            player.hp = playerMaxHp();
            log('The Temple restores your strength.', 'good');
          }
        }
        moved = true;
      }
      enemyTurn();
      updateHud();
      if(moved) animateCameraToPlayer(fromPos);
      else render();
      updateTooltip();
      if(!moved) flushPendingMove();
    }

    /* ============================== LOOK / SURROUNDINGS ============================== */
    const TILE_DESC = {
      water:"open water",
      river:"a running river",
      sand:"warm sand",
      grass:"a grassy field",
      forest:"dense forest",
      hill:"a rugged hill",
      mountain:"an impassable mountain",
      snow:"a snow-covered slope",
      cavefloor:"the violet-tinged floor of a cave",
      cavewall:"a solid cave wall",
      temple:"the sacred ground of the Temple",
      boulder:"a cluster of impassable boulders",
    };
    const LOOK_DIRS = [
      {dx:0,dy:-1,name:'north'}, {dx:0,dy:1,name:'south'},
      {dx:-1,dy:0,name:'west'}, {dx:1,dy:0,name:'east'},
      {dx:-1,dy:-1,name:'northwest'}, {dx:1,dy:-1,name:'northeast'},
      {dx:-1,dy:1,name:'southwest'}, {dx:1,dy:1,name:'southeast'},
    ];
    function describeSurroundings() {
      const here = TILE_DESC[map[player.y][player.x]] || 'unfamiliar ground';
      log(`You are standing on ${here}.`, 'info');

      const notes = {};

      function addNote(label, direction) {
        if (!notes[label]) notes[label] = new Set();
        notes[label].add(direction);
      }

      for (let dy = -5; dy <= 5; dy++) {
        for (let dx = -5; dx <= 5; dx++) {
          if (dx === 0 && dy === 0) continue;

          const nx = player.x + dx;
          const ny = player.y + dy;

          if (nx < 0 || ny < 0 || nx >= MAP_W || ny >= MAP_H) continue;

          const direction =
            dx === 0 && dy < 0 ? 'north' :
              dx === 0 && dy > 0 ? 'south' :
                dx < 0 && dy === 0 ? 'west' :
                  dx > 0 && dy === 0 ? 'east' :
                    dx < 0 && dy < 0 ? 'northwest' :
                      dx > 0 && dy < 0 ? 'northeast' :
                        dx < 0 && dy > 0 ? 'southwest' :
                          'southeast';

          const enemy = enemies.find(
            en => en.alive && en.x === nx && en.y === ny
          );

          if (enemy) {
            addNote(`a ${enemy.name}`, direction);
            continue;
          }

          const item = groundItems.find(
            g => g.x === nx && g.y === ny &&
              !(g.kind === 'chest' && g.opened)
          );

          if (item) {
            const label =
              item.kind === 'chest' ? 'a chest' :
                item.kind === 'potion' ? 'a potion' :
                  item.kind === 'speedpotion' ? 'a speed potion' :
                    'a scroll';

            addNote(label, direction);
            continue;
          }

          const t = map[ny][nx];

          if (
            t === 'mountain' ||
            t === 'cavewall' ||
            t === 'boulder' ||
            t === 'water'
          ) {
            addNote(TILE_DESC[t], direction);
          }
        }
      }

      const summary = Object.entries(notes).map(([label, directions]) => {
        const dirs = [...directions];

        if (dirs.length === 1)
          return `${label} to the ${dirs[0]}`;

        if (dirs.length === 2)
          return `${label} to the ${dirs[0]} and ${dirs[1]}`;

        return `${label} to the ${dirs.slice(0, -1).join(', ')}, and ${dirs.at(-1)}`;
      });

      if (summary.length) {
        log(`You notice ${summary.join(', ')}.`, 'info');
      } else {
        log('Nothing of note nearby.', 'info');
      }
    }


    /* ============================== RENDERING ============================== */




    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const VIEW_W = 21, VIEW_H = 13;
    const TILE_PX = 40;
    canvas.width = VIEW_W*TILE_PX;
    canvas.height = VIEW_H*TILE_PX;
    ctx.textBaseline = 'top';
    ctx.font = (TILE_PX-4)+"px Consolas, 'Courier New', monospace";
    ctx.textAlign = 'center';

    function drawTile(px,py,ch,color,bg){
      ctx.fillStyle = bg;
      ctx.fillRect(px, py, TILE_PX, TILE_PX);
      ctx.fillStyle = color;
      ctx.fillText(ch, px+TILE_PX/2, py+3);
    }

    let camX=0, camY=0;
    let cameraAnimFrame = null;
    let cameraAnimating = false;
    let moveAnim = null;
    let attackAnim = null;
    let deathTransition = null;

    function targetCamX(px){
      const x = px === undefined ? player.x : px;
      return Math.max(0, Math.min(MAP_W-VIEW_W, x - Math.floor(VIEW_W/2)));
    }
    function targetCamY(py){
      const y = py === undefined ? player.y : py;
      return Math.max(0, Math.min(MAP_H-VIEW_H, y - Math.floor(VIEW_H/2)));
    }
    function snapCameraToPlayer(){
      camX = targetCamX();
      camY = targetCamY();
    }
    function stopCameraAnimation(){
      if(cameraAnimFrame !== null) cancelAnimationFrame(cameraAnimFrame);
      cameraAnimFrame = null;
      cameraAnimating = false;
      moveAnim = null;
    }
    function animateCameraToPlayer(fromPos){
      const fromX = fromPos && typeof fromPos.x === 'number' ? fromPos.x : player.x;
      const fromY = fromPos && typeof fromPos.y === 'number' ? fromPos.y : player.y;
      const toX = player.x, toY = player.y;
      stopCameraAnimation();
      moveAnim = {
        fromX: fromX,
        fromY: fromY,
        toX: toX,
        toY: toY,
        start: performance.now(),
        duration: 140
      };
      cameraAnimating = true;
      const step = (now)=>{
        render(now);
        if(moveAnim){
          cameraAnimFrame = requestAnimationFrame(step);
        } else {
          cameraAnimating = false;
          cameraAnimFrame = null;
          flushPendingMove();
        }
      };
      cameraAnimFrame = requestAnimationFrame(step);
    }
    function stopAttackAnimation(){
      attackAnim = null;
    }
    function stopDeathTransition(){
      deathTransition = null;
    }
    function animateAttackLunge(fromX, fromY, targetX, targetY){
      stopAttackAnimation();
      attackAnim = {
        fromX: fromX,
        fromY: fromY,
        targetX: targetX,
        targetY: targetY,
        start: performance.now(),
        duration: 220
      };
      render();
      return new Promise(resolve=>{
        const step = (now)=>{
          render(now);
          if(!attackAnim){
            resolve();
            return;
          }
          if(now - attackAnim.start >= attackAnim.duration){
            attackAnim = null;
            render();
            resolve();
            return;
          }
          requestAnimationFrame(step);
        };
        requestAnimationFrame(step);
      });
    }

    function render(now){
      now = now || performance.now();
      let viewPlayerX = player.x;
      let viewPlayerY = player.y;
      if(moveAnim){
        const t = Math.min(1, (now - moveAnim.start) / moveAnim.duration);
        const p = 1 - Math.pow(1 - t, 3);
        viewPlayerX = moveAnim.fromX + (moveAnim.toX - moveAnim.fromX) * p;
        viewPlayerY = moveAnim.fromY + (moveAnim.toY - moveAnim.fromY) * p;
        if(t >= 1){
          moveAnim = null;
          viewPlayerX = player.x;
          viewPlayerY = player.y;
        }
      }
      camX = targetCamX(viewPlayerX);
      camY = targetCamY(viewPlayerY);
      ctx.fillStyle = '#050403';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      for(let vy=0; vy<=VIEW_H; vy++){
        for(let vx=0; vx<=VIEW_W; vx++){
          const mx = Math.floor(camX)+vx, my = Math.floor(camY)+vy;
          if(mx<0||my<0||mx>=MAP_W||my>=MAP_H){
           const px = Math.round((vx + Math.floor(camX) - camX) * TILE_PX);
           const py = Math.round((vy + Math.floor(camY) - camY) * TILE_PX);
           drawTile(px,py,'~',TILE.water.color,TILE.water.bg);
           continue;
          }
          const t = TILE[map[my][mx]];
          const px = Math.round((mx-camX) * TILE_PX);
          const py = Math.round((my-camY) * TILE_PX);
          drawTile(px,py,t.ch,t.color,t.bg);
          markDiscovered(mx, my); // anything drawn on the main screen counts as seen
        }
      }
      // ground items
      for(const g of groundItems){
        const vx = Math.round((g.x-camX) * TILE_PX);
        const vy = Math.round((g.y-camY) * TILE_PX);
        if(vx<-TILE_PX||vy<-TILE_PX||vx>canvas.width||vy>canvas.height) continue;
        if(g.kind==='chest' && !g.opened) drawTile(vx,vy,'$', '#e8c14a', TILE[map[g.y][g.x]].bg);
        else if(g.kind==='potion') drawTile(vx,vy,'!', '#e0473f', TILE[map[g.y][g.x]].bg);
        else if(g.kind==='speedpotion') drawTile(vx,vy,'!', '#59b8ff', TILE[map[g.y][g.x]].bg);
        else if(g.kind==='scroll') drawTile(vx,vy,'?', '#b565d6', TILE[map[g.y][g.x]].bg);
      }
      // enemies
      for(const e of enemies){
        if(!e.alive) continue;
        const vx = Math.round((e.x-camX) * TILE_PX), vy = Math.round((e.y-camY) * TILE_PX);
        if(vx<-TILE_PX||vy<-TILE_PX||vx>canvas.width||vy>canvas.height) continue;
        const colors = {1:'#b8b8b8',2:'#57b35c',3:'#4aa3d1',4:'#b565d6',5:'#e0473f'};
        drawTile(vx,vy,e.name.replace(/^[A-Za-z]+ /,'')[0], colors[e.tier], TILE[map[e.y][e.x]].bg);

        if(e.aware){
          ctx.strokeStyle = 'rgba(255,106,93,0.95)';
          ctx.lineWidth = 2;
          ctx.strokeRect(vx+2, vy+2, TILE_PX-4, TILE_PX-4);
        }
      }
      // player
      {
        let px = viewPlayerX;
        let py = viewPlayerY;
        if(attackAnim){
          const t = Math.min(1, (now - attackAnim.start) / attackAnim.duration);
          const lunge = t < 0.5 ? (t / 0.5) * 0.5 : (1 - ((t - 0.5) / 0.5)) * 0.5;
          px = attackAnim.fromX + (attackAnim.targetX - attackAnim.fromX) * lunge;
          py = attackAnim.fromY + (attackAnim.targetY - attackAnim.fromY) * lunge;
        }
        const vx = Math.round((px-camX) * TILE_PX), vy = Math.round((py-camY) * TILE_PX);
        drawTile(vx,vy, '@', player.invisibleTurns>0 ? 'rgba(255,246,214,0.45)' : '#fff6d6', 'rgba(0,0,0,0)');
      }
      // range overlays are drawn last so they tint everything underneath without
      // being erased by later tile/entity draws.
      if(showAllVisibleEnemyRanges){
        for(const e of enemies){
          if(enemyIsVisibleOnMainView(e)) drawEnemyRangeOverlay(e);
        }
      } else if(hoveredEnemy && hoveredEnemy.alive){
        drawEnemyRangeOverlay(hoveredEnemy);
      }
      if(deathTransition && (deathTransition.phase === 'out' || deathTransition.phase === 'in')){
        const elapsed = now - deathTransition.start;
        let alpha = 0;
        if(deathTransition.phase === 'out'){
          alpha = Math.min(1, Math.max(0, elapsed / deathTransition.duration));
        } else {
          alpha = Math.max(0, 1 - (elapsed / deathTransition.duration));
        }
        ctx.fillStyle = 'rgba(0,0,0,' + alpha + ')';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }
      if(minimapDirty || miniPlayerX !== player.x || miniPlayerY !== player.y) renderMinimap();
    }

// Highlights the tiles a hovered enemy can see/act on: a bright inner ring for
// its attack range (ATTACK_RANGE) and a dimmer outer field for its aggro/chase
// range (AGGRO_RANGE) - mirrors the exact Chebyshev-distance checks in enemyTurn().
    function drawEnemyRangeOverlay(e){
      const aggroRange = enemyAggroRange(e);
      for(let dy=-aggroRange; dy<=aggroRange; dy++){
        for(let dx=-aggroRange; dx<=aggroRange; dx++){
          if(dx===0 && dy===0) continue; // leave the enemy's own tile untinted
          const mx = e.x+dx, my = e.y+dy;
          if(mx<0||my<0||mx>=MAP_W||my>=MAP_H) continue;
          const vx = Math.round((mx-camX) * TILE_PX), vy = Math.round((my-camY) * TILE_PX);
          if(vx<-TILE_PX||vy<-TILE_PX||vx>canvas.width||vy>canvas.height) continue;
          const dist = Math.max(Math.abs(dx), Math.abs(dy));
          ctx.fillStyle = dist<=ATTACK_RANGE ? 'rgba(224,71,63,0.40)' : 'rgba(224,71,63,0.16)';
          ctx.fillRect(vx, vy, TILE_PX, TILE_PX);
        }
      }
      // outline the enemy's own tile so it's clear which monster the range belongs to
      const evx = Math.round((e.x-camX) * TILE_PX), evy = Math.round((e.y-camY) * TILE_PX);
      if(evx>-TILE_PX && evy>-TILE_PX && evx<canvas.width && evy<canvas.height){
        ctx.strokeStyle = 'rgba(232,162,79,0.9)';
        ctx.lineWidth = 2;
        ctx.strokeRect(evx+1, evy+1, TILE_PX-2, TILE_PX-2);
      }
    }

    let hoveredEnemy = null;
    // Enemy ranges show while CTRL is held, OR permanently once CAPS LOCK latches
    // them on. Keeping the two sources separate means releasing CTRL (or the window
    // losing focus) can't clear the sticky toggle.
    let rangesHeld = false;
    let rangesLocked = false;
    let showAllVisibleEnemyRanges = false;
    function refreshRangeVisibility(){
      const next = rangesHeld || rangesLocked;
      const capsKbd = document.getElementById('kbdCaps');
      if(capsKbd) capsKbd.classList.toggle('locked', rangesLocked);
      if(next === showAllVisibleEnemyRanges) return;
      showAllVisibleEnemyRanges = next;
      render();
    }
    function enemyIsVisibleOnMainView(e){
      if(!e || !e.alive) return false;
      const vx = e.x-camX, vy = e.y-camY;
      return vx>=0 && vy>=0 && vx<VIEW_W && vy<VIEW_H;
    }

    const tooltip = document.getElementById('tooltip');
    function slug(name){ return name.toLowerCase().replace(/\s+/g,'_'); }
    let lastMousePx = null, lastMousePy = null;
    function updateTooltip(){
      if(lastMousePx===null) return;
      const vx = Math.floor(lastMousePx / TILE_PX), vy = Math.floor(lastMousePy / TILE_PX);
      const mx = Math.floor(camX+vx), my = Math.floor(camY+vy);
      const e = enemies.find(en=>en.alive && en.x===mx && en.y===my) || null;
      if(e !== hoveredEnemy){
        hoveredEnemy = e;
        render(); // redraw so the range overlay appears/updates/clears immediately
      }
      if(e){
        const hpPct = Math.max(0, e.hp/e.maxHp*100);
        const aggroRange = enemyAggroRange(e);
        tooltip.innerHTML = `
      <img src="enemies/${slug(e.baseName)}.jpg" onerror="this.style.display='none'">
      <div class="nm tier${e.tier}">${e.name}</div>
      <div class="hpbarwrap"><div class="hpbar" style="width:${hpPct}%"></div></div>
      HP ${e.hp} / ${e.maxHp}<br>ATK ${e.atk} &nbsp;DEF ${e.def} &nbsp;SPD ${e.spd}<br>
      <span style="color:#e0473f">Attack range ${ATTACK_RANGE}</span><br>
      <span style="color:#e0473f;opacity:0.7">Aggro range ${aggroRange}</span>`;
        tooltip.style.left = (lastMousePx+16)+'px';
        tooltip.style.top = (lastMousePy+16)+'px';
        tooltip.style.display = 'block';
      } else {
        tooltip.style.display = 'none';
      }
    }
    canvas.addEventListener('mousemove', (ev)=>{
      const rect = canvas.getBoundingClientRect();
      lastMousePx = ev.clientX - rect.left;
      lastMousePy = ev.clientY - rect.top;
      updateTooltip();
    });
    canvas.addEventListener('mouseleave', ()=>{
      lastMousePx=null; lastMousePy=null; tooltip.style.display='none';
      if(hoveredEnemy){ hoveredEnemy=null; render(); }
    });


    /* ============================== MINIMAP ============================== */
    const mini = document.getElementById('minimap');
    const sideMini = document.getElementById('sideMinimap');
    const mctx = mini.getContext('2d');
    const sideCtx = sideMini.getContext('2d');
    mini.width = MAP_W*3; mini.height = MAP_H*3;
    sideMini.width = MAP_W*2; sideMini.height = MAP_H*2;
    // The minimap terrain is expensive to rasterise (MAP_W*MAP_H fills per canvas),
    // so it lives on cached offscreen canvases that are only patched tile-by-tile as
    // fog of war lifts. Per-frame rendering is then just a blit plus two markers.
    const miniBases = {};
    function makeMiniBase(scale){
      const c = document.createElement('canvas');
      c.width = MAP_W*scale; c.height = MAP_H*scale;
      return { canvas:c, ctx:c.getContext('2d'), scale:scale };
    }
    function ensureMiniBases(){
      if(!miniBases[3]) miniBases[3] = makeMiniBase(3);
      if(!miniBases[2]) miniBases[2] = makeMiniBase(2);
    }
    function paintMiniTile(base, x, y){
      const s = base.scale;
      const c = base.ctx;
      c.clearRect(x*s, y*s, s, s);
      c.fillStyle = discovered[y][x] ? TILE[map[y][x]].color : 'rgba(3,2,1,0.72)';
      c.fillRect(x*s, y*s, s, s);
    }
    function rebuildMinimapBases(){
      ensureMiniBases();
      for(const scale of [2,3]){
        const base = miniBases[scale];
        base.ctx.clearRect(0, 0, base.canvas.width, base.canvas.height);
        for(let y=0;y<MAP_H;y++){
          for(let x=0;x<MAP_W;x++) paintMiniTile(base, x, y);
        }
      }
      minimapDirty = true;
    }
    function markDiscovered(x, y){
      if(discovered[y][x]) return;
      discovered[y][x] = true;
      ensureMiniBases();
      paintMiniTile(miniBases[3], x, y);
      paintMiniTile(miniBases[2], x, y);
      minimapDirty = true;
    }
    function renderMinimapCanvas(ctx, scale){
      ensureMiniBases();
      ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);
      ctx.drawImage(miniBases[scale].canvas, 0, 0);
      ctx.fillStyle = '#ffe08a';
      ctx.fillRect(spawnPoint.x*scale-1, spawnPoint.y*scale-1, Math.max(2, scale+2), Math.max(2, scale+2));
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(player.x*scale-1, player.y*scale-1, Math.max(2, scale+2), Math.max(2, scale+2));
    }
    function renderMinimap(){
      if(mapOpen) renderMinimapCanvas(mctx, 3);
      renderMinimapCanvas(sideCtx, 2);
      minimapDirty = false;
      miniPlayerX = player.x;
      miniPlayerY = player.y;
    }

    /* ============================== HUD / OVERLAYS ============================== */
    function updateHud(){
      document.getElementById('hLvl').textContent = player.lvl;
      const maxHp = playerMaxHp();
      player.hp = Math.min(player.hp, maxHp);
      document.getElementById('hpbar').style.width = Math.max(0,(player.hp/maxHp*100))+'%';
      document.getElementById('hptext').textContent = player.hp+' / '+maxHp;
      document.getElementById('xpbar').style.width = (player.xp/xpToNext(player.lvl)*100)+'%';
      document.getElementById('hAtk').textContent = playerAtk();
      document.getElementById('hDef').textContent = playerDef();
      document.getElementById('hSpd').textContent = playerSpd();
      document.getElementById('hMf').textContent = playerMf();
      document.getElementById('hGold').textContent = player.gold;
      document.getElementById('hDeaths').textContent = player.deaths;
    }

    function slotLabel(it){
      if(!it) return '-';
      const line = itemStatLine(it);
      return it.name + (line? ' \u2022 '+line : '');
    }
    function bestSlotScore(it){
      if(!it) return null;
      if(it.kind==='weapon'){
        const base = it.atk || 0;
        const bonus = it.mod === 'atk' ? (it.modAmt || 0) : 0;
        return base + bonus;
      }
      if(it.kind==='armor' || it.kind==='shield'){
        const base = it.def || 0;
        const bonus = it.mod === 'def' ? (it.modAmt || 0) : 0;
        return base + bonus;
      }
      return null;
    }
    function bestSlotIndexes(kind){
      const inventoryCandidates = player.inventory
        .map((it, idx)=>({it, idx, score: bestSlotScore(it)}))
        .filter(entry => entry.it.kind === kind && entry.score !== null);

      const equipped = player.equip[kind];
      const equippedScore = equipped ? bestSlotScore(equipped) : null;
      const threshold = equippedScore !== null ? equippedScore : -Infinity;

      const valid = inventoryCandidates.filter(entry => entry.score > threshold);
      if(valid.length === 0) return new Set();

      const best = Math.max(...valid.map(entry => entry.score));
      const winners = valid.filter(entry => entry.score === best);
      return winners.length === 1 ? new Set([winners[0].idx]) : new Set();
    }
    let invTab = 'all';
    function setInvTab(tab){
      invTab = tab;
      document.querySelectorAll('.inv-tab').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.tab === tab);
      });
      if(invOpen) renderInventory();
    }
    function filterVisibleInventory(){
      const visible = [];
      player.inventory.forEach((it, idx)=>{
        let matches = true;
        if(invTab === 'weapon') matches = it.kind === 'weapon';
        else if(invTab === 'armor') matches = it.kind === 'armor';
        else if(invTab === 'shield') matches = it.kind === 'shield';
        else if(invTab === 'other') matches = it.kind !== 'weapon' && it.kind !== 'armor' && it.kind !== 'shield';
        if(matches) visible.push({it, idx});
      });
      return visible;
    }
    function renderInventory(){
      document.getElementById('slotWeapon').querySelector('.val').textContent = slotLabel(player.equip.weapon);
      document.getElementById('slotShield').querySelector('.val').textContent = slotLabel(player.equip.shield);
      document.getElementById('slotArmor').querySelector('.val').textContent = slotLabel(player.equip.armor);

      const sg = document.getElementById('statGrid');
      sg.innerHTML = '';
      const rows = [
        // ['🎚️ Level', player.lvl],
        ['✨ XP to Next Level', player.xp+' / '+xpToNext(player.lvl)],
        ['❤️ HP', player.hp+' / '+playerMaxHp()],
        // ['⚔️ Attack', playerAtk()],
        // ['🛡️ Defense', playerDef()],
        // ['⚡ Speed', playerSpd()],
        // ['🍀 Magic Find', playerMf()],
        // ['💰 Gold', player.gold],
        // ['💀 Deaths', player.deaths],
        ['👣 Steps Taken', player.steps],
        ['📍 Position', player.x+', '+player.y],
      ];
      for(const [k,v] of rows){
        const d = document.createElement('div');
        d.className = 'row';
        const lbl = document.createElement('span');
        lbl.className = 'lbl';
        lbl.textContent = k;
        const val = document.createElement('b');
        val.textContent = v;
        d.appendChild(lbl); d.appendChild(val);
        sg.appendChild(d);
      }

      const best = {
        weapon: bestSlotIndexes('weapon'),
        shield: bestSlotIndexes('shield'),
        armor: bestSlotIndexes('armor'),
      };

      const list = document.getElementById('invList');
      list.innerHTML = '';
      const visible = filterVisibleInventory();
      if(visible.length===0){
        const d = document.createElement('div');
        d.className='invitem'; d.innerHTML = '<span class="nm" style="color:var(--parchment-dim)">No items in this category.</span>';
        list.appendChild(d);
        return;
      }
      visible.forEach(({it, idx})=>{
        const row = document.createElement('div');
        row.className = 'invitem';
        const isBest = (it.kind==='weapon' && best.weapon.has(idx)) ||
          (it.kind==='shield' && best.shield.has(idx)) ||
          (it.kind==='armor' && best.armor.has(idx));
        if(isBest) row.classList.add('best-slot');
        const cls = it.tier ? tierColorClass(it.tier) : '';
        const line = itemStatLine(it);
        const nm = document.createElement('span');
        nm.className='nm '+cls;
        const stackable = it.kind==='potion' || it.kind==='scroll' || it.kind==='speedpotion';
        const countTag = stackable && it.count>1 ? ' x'+it.count : '';
        const prefix = isBest ? '✅ ' : '';
        nm.textContent = prefix + it.name + countTag + (line? ' \u2014 '+line:'') + (stackable?'':' [T'+it.tier+']');
        row.appendChild(nm);
        if(it.kind==='potion'){
          const btn = document.createElement('button');
          btn.textContent = 'Drink';
          btn.onclick = ()=>{ usePotion(idx); };
          row.appendChild(btn);
        } else if(it.kind==='speedpotion'){
          const btn = document.createElement('button');
          btn.textContent = 'Drink';
          btn.onclick = ()=>{ useSpeedPotion(idx); };
          row.appendChild(btn);
        } else if(it.kind==='scroll'){
          const btn = document.createElement('button');
          btn.textContent = 'Read';
          btn.onclick = ()=>{ useScroll(idx); };
          row.appendChild(btn);
        } else {
          const btn = document.createElement('button');
          btn.textContent = 'Equip';
          btn.onclick = ()=>{ equipItem(idx); };
          row.appendChild(btn);
        }
        list.appendChild(row);
      });
    }
    function equipItem(idx){
      const it = player.inventory[idx];
      if(!it) return;
      const slot = it.kind;
      const old = player.equip[slot];
      player.equip[slot] = it;
      player.inventory.splice(idx,1);
      if(old) player.inventory.push(old);
      log(`You equip the ${it.name}.`, 'good');
      updateHud(); renderInventory();
    }
    function usePotion(idx){
      const it = player.inventory[idx];
      if(!it || it.kind!=='potion') return;
      it.count = (it.count||1)-1;
      if(it.count<=0) player.inventory.splice(idx,1);
      player.hp = playerMaxHp();
      log('You drink a Life Potion and feel fully restored.', 'good');
      updateHud(); renderInventory();
    }
    function useScroll(idx){
      const it = player.inventory[idx];
      if(!it || it.kind!=='scroll') return;
      it.count = (it.count||1)-1;
      if(it.count<=0) player.inventory.splice(idx,1);
      player.invisibleTurns = 15;
      log('You read the Scroll of Invisibility. The shadows swallow you.', 'good');
      updateHud(); renderInventory();
    }
    function useSpeedPotion(idx){
      const it = player.inventory[idx];
      if(!it || it.kind!=='speedpotion') return;
      it.count = (it.count||1)-1;
      if(it.count<=0) player.inventory.splice(idx,1);
      player.speedPotionTurns = 15;
      log('You drink a Potion of Speed. Your legs feel lightning-fast.', 'good');
      updateHud(); renderInventory();
    }
// document.getElementById('useAllPotions').onclick = ()=>{
//   const idx = player.inventory.findIndex(i=>i.kind==='potion');
//   if(idx>=0) usePotion(idx); else log("You have no potions.", 'info');
// };

    document.querySelectorAll('.inv-tab').forEach(button => {
      button.addEventListener('click', () => setInvTab(button.dataset.tab));
    });

    /* ============================== SAVE / LOAD ============================== */
    const SAVE_VERSION = 4; // v4 adds enemy fly flag

    function buildSaveObject(){
      return {
        version: SAVE_VERSION,
        savedAt: new Date().toISOString(),
        worldSeed: WORLD_SEED,
        rngState: rngState,
        map: map.map(row => row.map(t => TILE_CODE[t] || 'g').join('')),
        discovered: discovered.map(row => row.map(b => b?'1':'0').join('')),
        spawnPoint: {x:spawnPoint.x, y:spawnPoint.y},
        worldEdgesReached: Object.assign({}, worldEdgesReached),
        player: {
          x:player.x, y:player.y,
          lvl:player.lvl, xp:player.xp,
          maxHp:player.maxHp, hp:player.hp,
          baseAtk:player.baseAtk, baseDef:player.baseDef, baseSpd:player.baseSpd, baseMf:player.baseMf,
          gold:player.gold, deaths:player.deaths, steps:player.steps,
          invisibleTurns:player.invisibleTurns,
          speedPotionTurns:player.speedPotionTurns,
          equip: player.equip,
          inventory: player.inventory,
        },
        enemies: enemies.filter(e=>e.alive).map(e=>({
          name:e.name, baseName:e.baseName, tier:e.tier,
          hp:e.hp, maxHp:e.maxHp, atk:e.atk, def:e.def, spd:e.spd,
          aggro: enemyAggroRange(e),
          fly: !!e.fly,
          x:e.x, y:e.y, prefix:e.prefix||null, crit:!!e.crit, aware:!!e.aware,
        })),
        groundItems: groundItems.map(g=>({...g})),
      };
    }

    function saveGame(){
      try{
        const data = buildSaveObject();
        const blob = new Blob([JSON.stringify(data)], {type:'application/json'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        const ts = new Date().toISOString().replace(/[:.]/g,'-');
        a.href = url;
        a.download = `vagabond-save-${ts}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        log('Game saved to file.', 'good');
      }catch(err){
        console.error(err);
        log('Failed to save the game.', 'bad');
      }
    }

    function loadGameFromObject(data){
      if(!data || typeof data !== 'object' || !Array.isArray(data.map)){
        throw new Error('That does not look like a Vagabond save file.');
      }

      const decoded = data.map.map(rowStr=>{
        const row = [];
        for(const ch of rowStr) row.push(CODE_TILE[ch] || 'grass');
        if(row.length !== MAP_W) throw new Error('Save file map width does not match.');
        return row;
      });
      if(decoded.length !== MAP_H) throw new Error('Save file map height does not match.');
      map = decoded;

      if(Array.isArray(data.discovered) && data.discovered.length === MAP_H){
        discovered = data.discovered.map(rowStr=>{
          const row = [];
          for(const ch of rowStr) row.push(ch==='1');
          return row;
        });
      } else {
        // older save from before fog-of-war existed - start fresh, the player's
        // current surroundings get marked seen automatically by the render() below
        initDiscovered();
      }
      rebuildMinimapBases();

      spawnPoint = {x:data.spawnPoint.x, y:data.spawnPoint.y};
      rngState = data.rngState|0;
      Object.assign(worldEdgesReached, data.worldEdgesReached||{});

      Object.assign(player, data.player);
      player.equip = (data.player && data.player.equip) || {weapon:null, shield:null, armor:null};
      player.inventory = (data.player && data.player.inventory) || [];
      player.invisibleTurns = Number.isFinite(player.invisibleTurns) ? Math.max(0, player.invisibleTurns|0) : 0;
      player.speedPotionTurns = Number.isFinite(player.speedPotionTurns) ? Math.max(0, player.speedPotionTurns|0) : 0;

      enemies = (data.enemies||[]).map(e=>{
        const tmpl = enemyTemplateForSavedEnemy(e);
        return ({
        name:e.name, baseName:e.baseName, tier:e.tier,
        hp:e.hp, maxHp:e.maxHp, atk:e.atk, def:e.def, spd:e.spd,
        aggro: typeof e.aggro === 'number' ? e.aggro : AGGRO_RANGE,
        fly: typeof e.fly === 'boolean' ? e.fly : !!(tmpl && tmpl.fly),
        x:e.x, y:e.y, alive:true,
        prefix:e.prefix||null, crit:!!e.crit, aware:!!e.aware,
      });
      });
      occupied = new Set();
      for(const e of enemies) occupied.add(keyXY(e.x,e.y));

      groundItems = (data.groundItems||[]).map(g=>({...g}));

      toggleInv(false);
      toggleMap(false);

      stopCameraAnimation();
      stopAttackAnimation();
      stopDeathTransition();
      snapCameraToPlayer();
      updateHud();
      render();
      log('Game loaded.', 'good');
    }

    function loadGame(file){
      const reader = new FileReader();
      reader.onload = ()=>{
        try{
          const data = JSON.parse(reader.result);
          loadGameFromObject(data);
        }catch(err){
          console.error(err);
          log('Failed to load save file: '+err.message, 'bad');
        }
      };
      reader.onerror = ()=>{ log('Failed to read the file.', 'bad'); };
      reader.readAsText(file);
    }

    document.getElementById('btnSave').addEventListener('click', saveGame);
    document.getElementById('btnLoad').addEventListener('click', ()=>{
      document.getElementById('fileLoad').click();
    });
    document.getElementById('btnInvToMap').addEventListener('click', ()=>{
      toggleInv(false); toggleMap(true);
    });
    document.getElementById('btnMapToInv').addEventListener('click', ()=>{
      toggleMap(false); toggleInv(true);
    });
    document.getElementById('btnSideMap').addEventListener('click', ()=>{
      toggleMap();
    });
    document.getElementById('fileLoad').addEventListener('change', (ev)=>{
      const file = ev.target.files[0];
      if(file) loadGame(file);
      ev.target.value = ''; // allow re-selecting the same file later
    });

    /* ============================== INPUT ============================== */
    function toggleInv(force){
      invOpen = (force!==undefined) ? force : !invOpen;
      document.getElementById('invOverlay').classList.toggle('show', invOpen);
      if(invOpen) renderInventory();
    }
    function toggleMap(force){
      mapOpen = (force!==undefined) ? force : !mapOpen;
      document.getElementById('mapOverlay').classList.toggle('show', mapOpen);
      if(mapOpen) renderMinimap();
    }
    window.addEventListener('keydown', (ev)=>{
      const k = ev.key;
      if(k==='Control'){
        rangesHeld = true;
        refreshRangeVisibility();
        return;
      }
      if(k==='CapsLock'){
        rangesLocked = !rangesLocked;
        refreshRangeVisibility();
        return;
      }
      if(k==='Tab'){ ev.preventDefault(); toggleInv(); return; }
      if(k==='m' || k==='M'){ ev.preventDefault(); toggleMap(); return; }
      if(k==='Escape'){ toggleInv(false); toggleMap(false); return; }
      if(k==='k' || k==='K'){ ev.preventDefault(); saveGame(); return; }
      if(k==='l' || k==='L'){ ev.preventDefault(); document.getElementById('fileLoad').click(); return; }
      if(mapOpen || invOpen) return;
      if(k===' ' || k==='Spacebar'){ ev.preventDefault(); describeSurroundings(); return; } // <-- added
      const moves = {

        w:[0,-1], s:[0,1], a:[-1,0], d:[1,0],
        q:[-1,-1], e:[1,-1], z:[-1,1], c:[1,1],
        ArrowUp:[0,-1], ArrowDown:[0,1], ArrowLeft:[-1,0], ArrowRight:[1,0],
      };
      const key = k.length===1 ? k.toLowerCase() : k;
      if(moves[key]){
        ev.preventDefault();
        tryMove(moves[key][0], moves[key][1]);
      }
    });
    window.addEventListener('keyup', (ev)=>{
      if(ev.key!=='Control') return;
      rangesHeld = false;
      refreshRangeVisibility();
    });
    window.addEventListener('blur', ()=>{
      rangesHeld = false;
      refreshRangeVisibility();
    });

    /* ============================== INIT ============================== */
    function init(){
      generateMap();
      initDiscovered();
      rebuildMinimapBases();
      player.x = spawnPoint.x; player.y = spawnPoint.y;
      player.hp = playerMaxHp();
      spawnEnemies();
      spawnGroundStuff();
      log('You awaken at the Temple, mysterious wilds stretch before you.\nIn this strange world, danger lurks around every corner.\nChoose your battles wisely. Not every beast is worth the bloodshed, and some creatures are far more aggressive than others. Above all, beware the winged wyverns.\nMake good use of your gear and supplies, for cunning and preparation may prove as valuable as steel. Great treasures await those who dare venture beyond.', 'info');
      stopDeathTransition();
      stopAttackAnimation();
      snapCameraToPlayer();
      updateHud();
      render();
    }
    init();

  })();
</script>
</body>
</html>
